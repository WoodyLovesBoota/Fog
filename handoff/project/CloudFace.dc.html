<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:170px;height:112px;filter:drop-shadow(0 9px 11px rgba(120,120,180,.20))">
  <div style="position:absolute;background:#fff;border-radius:50%;width:66px;height:66px;left:8px;top:34px"></div>
  <div style="position:absolute;background:#fff;border-radius:50%;width:80px;height:80px;left:34px;top:9px"></div>
  <div style="position:absolute;background:#fff;border-radius:50%;width:60px;height:60px;left:84px;top:15px"></div>
  <div style="position:absolute;background:#fff;border-radius:50%;width:54px;height:54px;left:112px;top:36px"></div>
  <div style="position:absolute;background:#fff;border-radius:36px;width:170px;height:50px;left:0;bottom:8px"></div>

  <sc-if value="{{ hat }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:38px;top:-15px;width:94px;height:42px;z-index:6;transform:rotate(-4deg)">
      <div style="position:absolute;left:0;bottom:0;width:94px;height:17px;background:#C79A57;border-radius:50%;box-shadow:0 2px 3px rgba(80,60,20,.18)"></div>
      <div style="position:absolute;left:25px;bottom:7px;width:46px;height:30px;background:#D8B36A;border-radius:23px 23px 11px 11px"></div>
      <div style="position:absolute;left:25px;bottom:13px;width:46px;height:8px;background:#A87C3D"></div>
      <div style="position:absolute;left:44px;bottom:13px;width:8px;height:8px;background:#E9D4A1;border-radius:2px"></div>
    </div>
  </sc-if>

  <sc-if value="{{ openEyes }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:64px;top:53px;width:11px;height:13px;background:#2C2F60;border-radius:50%">
      <div style="position:absolute;right:1px;top:1px;width:3.5px;height:3.5px;background:#fff;border-radius:50%"></div>
    </div>
    <div style="position:absolute;left:95px;top:53px;width:11px;height:13px;background:#2C2F60;border-radius:50%">
      <div style="position:absolute;right:1px;top:1px;width:3.5px;height:3.5px;background:#fff;border-radius:50%"></div>
    </div>
  </sc-if>
  <sc-if value="{{ isSleepy }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:61px;top:55px;width:15px;height:8px;border-bottom:3px solid #2C2F60;border-radius:0 0 15px 15px"></div>
    <div style="position:absolute;left:92px;top:55px;width:15px;height:8px;border-bottom:3px solid #2C2F60;border-radius:0 0 15px 15px"></div>
  </sc-if>

  <div style="position:absolute;left:47px;top:64px;width:15px;height:9px;background:#F4C2C9;border-radius:50%;opacity:.92"></div>
  <div style="position:absolute;left:108px;top:64px;width:15px;height:9px;background:#F4C2C9;border-radius:50%;opacity:.92"></div>

  <sc-if value="{{ isHappy }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;left:75px;top:63px;width:22px;height:14px;background:#A85A52;border-radius:5px 5px 12px 12px;overflow:hidden">
      <div style="position:absolute;bottom:-3px;left:50%;transform:translateX(-50%);width:14px;height:8px;background:#E58B86;border-radius:50%"></div>
    </div>
  </sc-if>
  <sc-if value="{{ isSmile }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:75px;top:62px;width:22px;height:11px;border:3px solid #2C2F60;border-top:none;border-radius:0 0 18px 18px"></div>
  </sc-if>
  <sc-if value="{{ isSad }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;left:76px;top:71px;width:20px;height:10px;border:3px solid #2C2F60;border-bottom:none;border-radius:18px 18px 0 0"></div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:150},&quot;mood&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;happy&quot;,&quot;smile&quot;,&quot;sad&quot;,&quot;sleepy&quot;],&quot;default&quot;:&quot;happy&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;hat&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mood || 'happy';
    return {
      isHappy: m === 'happy',
      isSmile: m === 'smile',
      isSad: m === 'sad',
      isSleepy: m === 'sleepy',
      openEyes: m !== 'sleepy',
      hat: !!this.props.hat && this.props.hat !== 'false',
    };
  }
}
</script>
</body>
</html>
